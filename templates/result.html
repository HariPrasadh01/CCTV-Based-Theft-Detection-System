<!DOCTYPE html>
<html>
<head>
    <title>Detection Result: </title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="result-container">
    <h2>Detection Result</h2>
    {% if result %}
        <p><strong>Theft Detected!</strong> Screenshot has been sent to your email.</p>
        <img src="{{ url_for('static', filename='screenshot.jpg') }}" width="400">
    {% else %}
        <p> No theft detected.</p>
    {% endif %}
    </div>
</body>
</html>
